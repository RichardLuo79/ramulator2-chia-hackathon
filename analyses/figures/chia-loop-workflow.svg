 <title>CHIA loop workflow</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>CHIA loop workflow</dc:title>
    <dc:description>The CHIA loop. Pale-blue blocks represent simulation and evaluation; dark blocks represent model-development and round-completion activities. During development, training inputs and memory-request traces are inspectable, including oracle, candidate, and baseline observations. The separate dashed block marks optional synthetic tests and replay. Both feed statistics and memory-request traces back along the shared development-feedback arrow. Training and validation evaluation provide metrics to the independent reviewer, not raw request traces; the reviewer also receives model sources. Validation metrics are anonymous. Review, qualification, and summarization are grouped only for presentation: mandatory integrity checks cannot be waived, and the proposer writes the final summary after the independent review. The selected model and summary feed the next round. ChampSim supplies the workload frontend; synthetic tests and replay use Ramulator directly. Test and transfer results never feed back into search.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Matplotlib v3.10.8, https://matplotlib.org/</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
